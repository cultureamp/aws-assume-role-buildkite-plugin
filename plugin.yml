name: AWS Assume Role
description: Assumes an IAM Role before running the build command.
author: https://github.com/cultureamp
requirements:
  - aws
  - jq
configuration:
  properties:
    duration:
      type: string
    role:
      type: string
    region:
      type: string
    tags:
      type: array
      items:
        type: object
        properties:
          key:
            type: string
          value:
            type: string
        required:
          - key
          - value
        additionalProperties: false
  required:
    - role
  additionalProperties: false
